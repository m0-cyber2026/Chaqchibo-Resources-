<style>
:root {
  --nav:#111820;
  --nav2:#202c37;
  --bg:#f3f5f7;
  --white:#fff;
  --ink:#1d2935;
  --muted:#7b8792;
  --line:#e5e9ed;
  --silver:#c5cdd5;
  --green:#148567;
  --greenbg:#e6f5ee;
  --blue:#3976a8;
  --bluebg:#eaf2fa;
  --amber:#a66b16;
  --amberbg:#fff3dc;
  --shadow:0 5px 24px rgba(24,37,49,.045);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}
.sidebar{
  background:var(--nav);color:white;padding:24px 15px;
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column
}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px;border-bottom:1px solid #303a44}
.brandmark{
  width:40px;height:40px;border:1px solid #7a8792;border-radius:10px;
  display:grid;place-items:center;font-weight:800;letter-spacing:-1px;
  background:linear-gradient(145deg,#47535e,#18212a)
}
.brand strong{display:block;font-size:12px;letter-spacing:1px}
.brand small{display:block;color:#96a1ab;font-size:9px;letter-spacing:1.4px;margin-top:5px}
.navtitle{font-size:9px;color:#7f8b96;text-transform:uppercase;letter-spacing:1.6px;padding:25px 12px 10px}
nav{display:grid;gap:5px}
nav button{
  border:0;background:transparent;color:#aeb8c2;text-align:left;
  padding:12px;border-radius:8px;display:flex;align-items:center;gap:12px;
  transition:.2s
}
nav button:hover,nav button.active{background:#303c47;color:white}
nav button.active{box-shadow:inset 3px 0 #d4dce3}
.navicon{width:20px;text-align:center;font-size:16px}
.sidebarfoot{margin-top:auto;background:#1c2731;border:1px solid #303c47;border-radius:10px;padding:13px}
.sidebarfoot strong{font-size:11px}
.sidebarfoot p{font-size:10px;line-height:1.7;color:#9aa5ae;margin:7px 0 0}
.main{min-width:0}
.topbar{
  height:70px;background:white;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;gap:15px
}
.breadcrumb{font-size:12px;color:var(--muted)}
.breadcrumb b{color:var(--ink)}
.topright{display:flex;align-items:center;gap:12px}
.datepill{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:#65727e}
.avatar{width:35px;height:35px;border-radius:50%;background:#dfe5e9;display:grid;place-items:center;font-weight:800;font-size:11px}
.content{padding:30px 32px;max-width:1600px;margin:auto}
.page{display:none;animation:fade .2s ease}
.page.active{display:block}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:24px}
.eyebrow{font-size:10px;letter-spacing:1.6px;color:#89949e;text-transform:uppercase;font-weight:750;margin-bottom:8px}
h1{font-size:27px;letter-spacing:-.8px;margin:0;font-weight:750}
.pagehead p{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}
.btn{
  border:1px solid #dce2e7;background:white;color:#293744;border-radius:8px;
  padding:10px 14px;font-size:11px;font-weight:700;display:inline-flex;
  align-items:center;gap:7px;transition:.2s
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:#18232d;color:white;border-color:#18232d}
.btn.primary:hover{background:#2a3946}
.btn.danger{color:#a53c3c}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.kpi{background:white;border:1px solid var(--line);border-radius:11px;padding:18px;box-shadow:var(--shadow);min-width:0}
.kpitop{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#73808b;font-size:11px;font-weight:650}
.kpiicon{width:31px;height:31px;border-radius:8px;background:#f0f3f5;display:grid;place-items:center;font-size:15px}
